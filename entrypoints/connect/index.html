<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>PinProof · 폴더 연결</title>
    <style>
      /* 색·글자 토큰은 lib/tokens.css(main.ts 에서 불러옴) */
      * { box-sizing: border-box; }
      body {
        max-width: 520px; margin: 64px auto; padding: 0 16px; background: var(--color-bg); color: var(--color-ink);
        font: 400 var(--text-body)/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      }
      h2 { font-size: var(--text-title); font-weight: 800; margin: 0 0 12px; }
      button {
        height: 44px; padding: 0 20px; border: 0; border-radius: var(--radius-pill); background: var(--color-ink); color: var(--color-inverse);
        font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity var(--dur-tap) var(--ease-out), transform var(--dur-tap) var(--ease-out);
      }
      button:hover { opacity: 0.88; }
      button:active { transform: scale(0.97); }
      button:focus { outline: none; }
      button:focus-visible { outline: 2px solid var(--color-ink); outline-offset: 3px; }
      code { font-family: var(--font-mono); }
      #status { margin-top: 16px; color: var(--color-ink-soft); font-size: var(--text-small); }
      .muted { color: var(--color-ink-soft); }
      dialog {
        width: min(440px, calc(100vw - 32px)); padding: 20px; border: 1px solid var(--color-line); border-radius: var(--radius-control);
        background: var(--color-bg); color: var(--color-ink); box-shadow: var(--shadow-float);
      }
      dialog::backdrop { background: rgb(0 0 0 / 0.32); }
      dialog h3 { margin: 0 0 4px; font-size: 16px; font-weight: 800; overflow-wrap: anywhere; }
      dialog p { margin: 0 0 8px; font-size: var(--text-small); }
      dialog ul { margin: 0 0 12px; padding-left: 18px; font-size: var(--text-small); overflow-wrap: anywhere; }
      #setup-skill { margin: 0 0 14px; padding: 12px; border: 1px solid var(--color-line); border-radius: var(--radius-paper); background: var(--color-surface); }
      #setup-skill label { display: flex; align-items: flex-start; gap: 8px; font-weight: 600; cursor: pointer; margin-bottom: 6px; }
      #setup-skill input { margin: 4px 0 0; accent-color: var(--color-ink); width: 16px; height: 16px; flex: none; }
      #setup-skill p:last-child { margin: 0; }
      .actions { display: flex; justify-content: flex-end; gap: 8px; }
      .actions button { height: 38px; padding: 0 18px; font-size: 14px; }
      .actions button.ghost { background: transparent; color: var(--color-ink); border: 1px solid var(--color-line); }
    </style>
  </head>
  <body>
    <h2>프로젝트 폴더 연결</h2>
    <p><code id="origin"></code> 앱의 기록을 저장할 프로젝트 폴더를 고르세요.</p>
    <button id="pick">폴더 선택</button>
    <p id="status" role="status"></p>
    <dialog id="setup" aria-labelledby="setup-title">
      <h3 id="setup-title"></h3>
      <p class="muted">이 폴더에 다음 작업을 합니다.</p>
      <ul id="setup-items"></ul>
      <div id="setup-skill" hidden>
        <label>
          <input type="checkbox" id="skill-check" />
          <span>데이터 정합성 점검 스킬도 설치 <span class="muted">(선택)</span> <code id="skill-name"></code></span>
        </label>
        <p class="muted" id="skill-summary"></p>
        <ul class="muted" id="skill-files"></ul>
        <p class="muted">설치하지 않아도 PinProof 는 그대로 동작하고, 나중에 패널에서 설치할 수 있습니다.</p>
      </div>
      <div class="actions">
        <button class="ghost" id="setup-cancel">취소</button>
        <button id="setup-ok" autofocus>연결</button>
      </div>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
